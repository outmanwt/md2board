<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>md2board · 现代 AI 工程生命周期工作台</title>
  <style>
    /* ============================================================
       md2board — Design Tokens & Foundations
       Adopted from File 3 (Nordic Light & Obsidian Dark)
       ============================================================ */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    :root {
      --font-sans: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
      --font-mono: ui-monospace, 'Cascadia Code', Consolas, 'JetBrains Mono', 'SF Mono', Menlo, monospace;

      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-solid: #ffffff;
      --surface-muted: #f1f5f9;
      --surface-glass: rgba(255, 255, 255, 0.78);

      --line: rgba(226, 232, 240, 0.85);
      --line-soft: rgba(234, 240, 247, 0.85);
      --line-strong: rgba(203, 213, 225, 0.9);
      --line-hover: rgba(2, 132, 199, 0.35);

      --ink: #0b1220;
      --ink-2: #334155;
      --ink-3: #64748b;
      --ink-4: #94a3b8;

      --azure: #0284c7;
      --azure-ink: #0369a1;
      --azure-soft: rgba(2, 132, 199, 0.08);
      --mint: #10b981;
      --mint-ink: #047857;
      --mint-soft: rgba(16, 185, 129, 0.09);
      --amber: #f59e0b;
      --amber-soft: rgba(245, 158, 11, 0.1);
      --rose: #f43f5e;
      --rose-soft: rgba(244, 63, 94, 0.08);

      --shadow-sm: 0 1px 2px rgba(11, 18, 32, 0.04), 0 1px 3px rgba(11, 18, 32, 0.03);
      --shadow-md: 0 12px 32px -12px rgba(11, 18, 32, 0.09), 0 4px 10px -4px rgba(11, 18, 32, 0.03);
      --shadow-lift: 0 22px 48px -20px rgba(2, 132, 199, 0.22), 0 8px 18px -8px rgba(11, 18, 32, 0.06);

      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 28px;

      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-out: cubic-bezier(0.4, 0, 0.2, 1);
    }

    html[data-theme="dark"] {
      --bg: #090e17;
      --surface: #101725;
      --surface-solid: #111a2a;
      --surface-muted: #172235;
      --surface-glass: rgba(16, 23, 37, 0.78);

      --line: rgba(148, 163, 184, 0.14);
      --line-soft: rgba(148, 163, 184, 0.08);
      --line-strong: rgba(148, 163, 184, 0.25);
      --line-hover: rgba(56, 189, 248, 0.45);

      --ink: #f1f5f9;
      --ink-2: #cbd5e1;
      --ink-3: #8191a6;
      --ink-4: #54657d;

      --azure: #38bdf8;
      --azure-ink: #7dd3fc;
      --azure-soft: rgba(56, 189, 248, 0.12);
      --mint: #34d399;
      --mint-ink: #6ee7b7;
      --mint-soft: rgba(52, 211, 153, 0.12);
      --amber: #fbbf24;
      --amber-soft: rgba(251, 191, 36, 0.12);
      --rose: #fb7185;
      --rose-soft: rgba(251, 113, 133, 0.12);

      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4);
      --shadow-md: 0 14px 36px -14px rgba(0, 0, 0, 0.65);
      --shadow-lift: 0 22px 50px -20px rgba(56, 189, 248, 0.28), 0 10px 24px -10px rgba(0, 0, 0, 0.5);
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--ink);
      font-size: 15px;
      line-height: 1.6;
      letter-spacing: -0.012em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      overflow-x: hidden;
    }

    button { font-family: inherit; color: inherit; }
    .mono { font-family: var(--font-mono); font-feature-settings: "tnum" 1; }

    /* ---- Ambient background lighting with smooth drift ---- */
    .ambient {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .ambient::before {
      content: "";
      position: absolute;
      width: 720px;
      height: 480px;
      left: 2%;
      top: -10%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(2, 132, 199, 0.12), transparent 68%);
      filter: blur(40px);
      animation: driftLeft 18s ease-in-out infinite alternate;
    }
    .ambient::after {
      content: "";
      position: absolute;
      width: 680px;
      height: 440px;
      right: 4%;
      top: -6%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.11), transparent 68%);
      filter: blur(40px);
      animation: driftRight 22s ease-in-out infinite alternate;
    }
    html[data-theme="dark"] .ambient::before {
      background: radial-gradient(circle, rgba(56, 189, 248, 0.13), transparent 68%);
    }
    html[data-theme="dark"] .ambient::after {
      background: radial-gradient(circle, rgba(52, 211, 153, 0.11), transparent 68%);
    }
    @keyframes driftLeft {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(60px, 40px) scale(1.08); }
    }
    @keyframes driftRight {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-50px, 35px) scale(1.06); }
    }

    /* ---- Shell container ---- */
    .shell {
      position: relative;
      z-index: 1;
      width: min(100% - 48px, 1280px);
      margin: 0 auto;
      padding: 16px 0 100px;
    }

    /* ---- Floating frosted glass topbar ---- */
    .topbar {
      position: sticky;
      top: 14px;
      z-index: 60;
      height: 58px;
      padding: 0 14px 0 18px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--surface-glass);
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    .topbar:hover {
      border-color: var(--line-strong);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }
    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--azure), var(--mint));
      color: #fff;
      display: grid;
      place-items: center;
      box-shadow: 0 4px 14px -4px rgba(2, 132, 199, 0.5);
    }
    .brand-copy {
      display: flex;
      flex-direction: column;
    }
    .brand-name {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    .brand-meta {
      font-size: 10px;
      font-family: var(--font-mono);
      color: var(--ink-4);
      letter-spacing: 0.04em;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 34px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--ink-2);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      position: relative;
      transition: all 0.2s var(--ease-out);
    }
    .action-btn:hover {
      border-color: var(--azure);
      color: var(--azure-ink);
      box-shadow: var(--shadow-sm);
      transform: translateY(-1px);
    }
    .action-btn svg { width: 14px; height: 14px; }
    .icon-btn {
      width: 34px;
      height: 34px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--ink-2);
      cursor: pointer;
      transition: all 0.2s var(--ease-out);
    }
    .icon-btn:hover {
      border-color: var(--azure);
      color: var(--azure-ink);
      box-shadow: var(--shadow-sm);
      transform: translateY(-1px);
    }
    .icon-btn svg { width: 15px; height: 15px; }

    .badge-dot {
      position: absolute;
      top: -3px;
      right: -3px;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      border-radius: 999px;
      background: var(--azure);
      color: #fff;
      font-family: var(--font-mono);
      font-size: 9.5px;
      font-weight: 700;
      display: grid;
      place-items: center;
      box-shadow: 0 0 0 2px var(--surface);
      animation: pulseBadge 2.2s infinite;
    }
    .badge-dot[hidden] { display: none; }
    @keyframes pulseBadge {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      padding: 0 4px;
      border: 1px solid var(--line);
      border-bottom-color: var(--line-strong);
      border-radius: 5px;
      background: var(--surface-muted);
      color: var(--ink-4);
      font: 9px var(--font-mono);
      letter-spacing: 0.04em;
    }

    /* ---- Hero Section & Circular Progress Gauge ---- */
    .hero {
      padding: 56px 6px 36px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 36px;
    }
    .eyebrow {
      margin: 0 0 14px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--azure-ink);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .eyebrow-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 0 3px var(--mint-soft);
      animation: pulseDot 2s infinite;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.9); }
    }
    .hero h1 {
      margin: 0 0 16px;
      font-size: clamp(34px, 4.8vw, 64px);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -0.045em;
    }
    .hero .goal {
      margin: 0;
      max-width: 720px;
      color: var(--ink-2);
      font-size: 16px;
      line-height: 1.7;
    }

    .global-progress {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(var(--azure) var(--progress, 0%), var(--surface-muted) 0);
      box-shadow: var(--shadow-sm);
      position: relative;
      flex-shrink: 0;
      transition: background 0.6s var(--ease);
    }
    .global-progress::before {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      background: var(--surface);
      box-shadow: inset 0 2px 5px rgba(11, 18, 32, 0.04);
    }
    .global-progress-copy {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .global-progress-copy strong {
      font-family: var(--font-mono);
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.04em;
      color: var(--ink);
    }
    .global-progress-copy span {
      margin-top: 5px;
      font-family: var(--font-mono);
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-4);
    }

    /* ---- Breadcrumb navigation bar ---- */
    .context-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 0 4px 28px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }
    .breadcrumbs {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      font-family: var(--font-mono);
      font-size: 12px;
    }
    .crumb {
      border: 0;
      background: transparent;
      padding: 4px 8px;
      border-radius: 7px;
      color: var(--ink-3);
      cursor: pointer;
      font: inherit;
      transition: all 0.16s var(--ease-out);
    }
    .crumb:hover {
      background: var(--azure-soft);
      color: var(--azure-ink);
    }
    .crumb.current {
      color: var(--ink);
      font-weight: 600;
      background: var(--surface-muted);
      cursor: default;
    }
    .crumb-sep {
      color: var(--ink-4);
      user-select: none;
      font-size: 11px;
    }
    .context-hint {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--ink-4);
      font-family: var(--font-mono);
    }

    /* ---- View transition animations ---- */
    .stage { position: relative; }
    .view { position: relative; }
    .view.in-forward { animation: viewInForward 0.38s var(--ease) both; }
    .view.in-back { animation: viewInBack 0.36s var(--ease) both; }
    @keyframes viewInForward {
      from { opacity: 0; transform: translate3d(28px, 0, 0) scale(0.992); }
      to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    }
    @keyframes viewInBack {
      from { opacity: 0; transform: translate3d(-24px, 0, 0) scale(0.992); }
      to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    }

    /* ---- Phase Axis with continuous track & shimmer ---- */
    .phase-axis {
      display: grid;
      grid-template-columns: repeat(var(--count, 3), minmax(0, 1fr));
      gap: 16px;
      margin: 10px 0 34px;
    }
    .axis-node { display: flex; flex-direction: column; gap: 8px; }
    .axis-track {
      position: relative;
      height: 4px;
      background: var(--line);
      border-radius: 999px;
      overflow: hidden;
    }
    .axis-fill {
      position: absolute;
      inset: 0 auto 0 0;
      background: linear-gradient(90deg, var(--azure), var(--mint));
      border-radius: 999px;
      transition: width 0.6s var(--ease);
    }
    .axis-fill::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 20%, rgba(255, 255, 255, 0.6) 50%, transparent 80%);
      background-size: 200% 100%;
      animation: shimmer 2.4s linear infinite;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .axis-label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--ink-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ---- Section Header ---- */
    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }
    .section-kicker {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--azure-ink);
      margin-bottom: 6px;
    }
    .section-head h2 {
      margin: 0;
      font-size: clamp(22px, 2.5vw, 32px);
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .section-head p {
      margin: 6px 0 0;
      color: var(--ink-3);
      font-size: 14px;
      max-width: 680px;
    }
    .section-stat {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-3);
      padding: 4px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      white-space: nowrap;
    }

    /* ---- Deck Grid & Cards ---- */
    .deck-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 20px;
    }
    .deck-card {
      grid-column: span 4;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      padding: 24px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: transform 0.35s var(--ease), box-shadow 0.35s var(--ease), border-color 0.25s;
    }
    .deck-card.feature { grid-column: span 6; }
    .deck-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(400px circle at var(--mouse-x, 50%) var(--mouse-y, 0%), rgba(2, 132, 199, 0.08), transparent 60%);
      opacity: 0;
      transition: opacity 0.35s;
      pointer-events: none;
    }
    .deck-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lift);
      border-color: var(--line-hover);
    }
    .deck-card:hover::before { opacity: 1; }
    .meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .type-label {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-4);
    }
    .deck-card h3 {
      margin: 0 0 10px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.25;
      color: var(--ink);
    }
    .deck-card p {
      margin: 0 0 24px;
      font-size: 13.5px;
      line-height: 1.6;
      color: var(--ink-3);
      flex: 1;
    }
    .card-footer {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--line-soft);
    }

    /* ---- Status Capsule Pill ---- */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.01em;
      background: var(--azure-soft);
      color: var(--azure-ink);
    }
    .status-pill.done {
      background: var(--mint-soft);
      color: var(--mint-ink);
    }
    .status-pill.wait {
      background: var(--surface-muted);
      color: var(--ink-3);
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    /* ---- Progress Row & Track ---- */
    .progress-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-3);
      margin-bottom: 7px;
    }
    .progress-track {
      position: relative;
      height: 5px;
      border-radius: 999px;
      background: var(--surface-muted);
      overflow: hidden;
    }
    .progress-fill {
      position: absolute;
      inset: 0 auto 0 0;
      background: linear-gradient(90deg, var(--azure), var(--mint));
      border-radius: 999px;
      transition: width 0.6s var(--ease);
    }

    /* ---- Level 4: Progress Breakdown ---- */
    .breakdown-card {
      margin-top: 18px;
      padding: 18px 18px 4px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }
    .breakdown-row { margin-bottom: 16px; }
    .breakdown-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 7px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--ink-3);
    }
    .breakdown-head span:first-child {
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink-2);
    }
    .breakdown-head span:last-child { color: var(--ink); font-weight: 600; }

    /* ---- Level 3: Section Rows List ---- */
    .list-surface {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .section-row {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr) 180px 32px;
      align-items: center;
      gap: 20px;
      padding: 18px 24px;
      border-bottom: 1px solid var(--line-soft);
      cursor: pointer;
      transition: background 0.18s var(--ease-out);
    }
    .section-row:last-child { border-bottom: 0; }
    .section-row:hover { background: var(--surface-muted); }
    .row-num {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--azure-ink);
    }
    .row-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    .row-sub {
      margin-top: 3px;
      font-size: 12.5px;
      color: var(--ink-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row-progress { display: flex; align-items: center; gap: 12px; }
    .row-progress .progress-track { flex: 1; }
    .row-progress span {
      width: 36px;
      text-align: right;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-3);
    }
    .chev {
      color: var(--ink-4);
      display: grid;
      place-items: center;
      transition: transform 0.2s, color 0.2s;
    }
    .section-row:hover .chev {
      transform: translateX(3px);
      color: var(--azure);
    }

    /* ---- Level 4: Detail Layout ---- */
    .back-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }
    .back-btn {
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--ink-3);
      font-size: 13px;
      font-weight: 650;
      transition: color 0.18s;
    }
    .back-btn:hover { color: var(--azure-ink); }

    .detail-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.12fr) minmax(380px, 0.88fr);
      gap: 36px;
      align-items: start;
    }
    .detail-main { min-width: 0; }
    .detail-side { position: sticky; top: 92px; min-width: 0; }
    .detail-title {
      font-size: clamp(30px, 4vw, 54px);
      line-height: 1.06;
      font-weight: 800;
      letter-spacing: -0.05em;
      margin: 6px 0 16px;
    }
    .detail-goal {
      color: var(--ink-2);
      font-size: 15.5px;
      line-height: 1.75;
      max-width: 820px;
    }

    .detail-metrics {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      margin: 28px 0 36px;
      padding: 16px 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }
    .metric { display: flex; flex-direction: column; gap: 3px; }
    .metric strong {
      font-family: var(--font-mono);
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
    }
    .metric span {
      color: var(--ink-4);
      font-size: 10px;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .checklist-title, .diff-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 0 0 14px;
    }
    .checklist-title h3, .diff-title h3 {
      margin: 0;
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .checklist-title span, .diff-title span {
      color: var(--ink-4);
      font: 10px var(--font-mono);
    }

    .checklist { border-top: 1px solid var(--line); }
    .check-item {
      display: grid;
      grid-template-columns: 24px 1fr auto;
      align-items: start;
      gap: 14px;
      padding: 16px 4px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      user-select: none;
      transition: background 0.18s;
    }
    .check-item:hover .check-copy { color: var(--ink); }
    .check-box {
      appearance: none;
      width: 20px;
      height: 20px;
      border: 1.6px solid var(--line-strong);
      border-radius: 7px;
      background: var(--surface-solid);
      display: grid;
      place-items: center;
      cursor: pointer;
      margin: 2px 0 0;
      transition: 0.18s var(--ease);
    }
    .check-box::before {
      content: "";
      width: 9px;
      height: 5px;
      border-left: 2px solid white;
      border-bottom: 2px solid white;
      transform: rotate(-45deg) scale(0.4);
      opacity: 0;
      transition: 0.16s var(--ease);
    }
    .check-box:checked {
      background: var(--mint);
      border-color: var(--mint);
      box-shadow: 0 0 0 4px var(--mint-soft);
    }
    .check-box:checked::before {
      opacity: 1;
      transform: rotate(-45deg) scale(1);
    }
    .check-copy {
      color: var(--ink-2);
      line-height: 1.55;
      font-size: 14px;
      transition: color 0.18s;
    }
    .check-item.is-done .check-copy {
      color: var(--ink-4);
      text-decoration: line-through;
      text-decoration-color: rgba(148, 163, 184, 0.6);
    }
    .check-code {
      font: 10.5px var(--font-mono);
      color: var(--ink-4);
      padding: 2px 6px;
      border-radius: 5px;
      background: var(--surface-muted);
    }

    /* ---- Diff Snapshot Window ---- */
    .diff-card {
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: #0e1724;
      box-shadow: var(--shadow-md);
    }
    .diff-bar {
      height: 42px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #94a3b8;
      font: 11px var(--font-mono);
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      background: rgba(255, 255, 255, 0.03);
    }
    .window-dots { display: flex; gap: 6px; }
    .window-dots i {
      display: block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #475569;
    }
    .window-dots i:nth-child(1) { background: #ef4444; }
    .window-dots i:nth-child(2) { background: #f59e0b; }
    .window-dots i:nth-child(3) { background: #10b981; }
    .diff-code {
      margin: 0;
      padding: 16px 0;
      overflow: auto;
      font: 11.5px / 1.72 var(--font-mono);
      color: #cbd5e1;
      max-height: 480px;
    }
    .diff-line {
      display: block;
      padding: 0 16px;
      white-space: pre;
      min-width: max-content;
    }
    .diff-line.add { color: #86efac; background: rgba(16, 185, 129, 0.1); }
    .diff-line.del { color: #fda4af; background: rgba(225, 29, 72, 0.1); }
    .diff-line.meta { color: #7dd3fc; background: rgba(56, 189, 248, 0.08); }

    /* ---- Drawers & Modals ---- */
    .drawer-wrap, .modal-wrap {
      position: fixed;
      inset: 0;
      z-index: 80;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.26s;
    }
    .drawer-wrap.open, .modal-wrap.open {
      pointer-events: auto;
      opacity: 1;
    }
    .scrim {
      position: absolute;
      inset: 0;
      background: rgba(11, 18, 32, 0.25);
      backdrop-filter: blur(4px);
    }
    html[data-theme="dark"] .scrim { background: rgba(0, 0, 0, 0.5); }

    .drawer {
      position: absolute;
      right: 14px;
      top: 14px;
      bottom: 14px;
      width: min(540px, calc(100vw - 28px));
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      background: var(--surface-solid);
      box-shadow: 0 35px 90px rgba(11, 18, 32, 0.22);
      transform: translateX(36px) scale(0.985);
      transition: transform 0.34s var(--ease);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .drawer-wrap.open .drawer { transform: none; }
    .drawer-head {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .drawer-head h3 { margin: 0; font-size: 15px; font-weight: 700; }
    .drawer-head p { margin: 3px 0 0; color: var(--ink-4); font-size: 11px; font-family: var(--font-mono); }

    .drawer-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 20px;
      border-bottom: 1px solid var(--line-soft);
      background: var(--surface-muted);
    }
    .drawer-tab {
      padding: 6px 12px;
      border: 0;
      background: transparent;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-3);
      cursor: pointer;
      transition: all 0.16s;
    }
    .drawer-tab.active {
      background: var(--surface);
      color: var(--ink);
      box-shadow: var(--shadow-sm);
    }
    .filter-chips {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      border-bottom: 1px solid var(--line-soft);
      overflow-x: auto;
    }
    .chip {
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      font-size: 10.5px;
      font-family: var(--font-mono);
      color: var(--ink-3);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.16s;
    }
    .chip.active {
      background: var(--azure-soft);
      border-color: var(--azure);
      color: var(--azure-ink);
      font-weight: 600;
    }

    .drawer-body {
      padding: 10px 20px 24px;
      overflow-y: auto;
      flex: 1;
    }

    .log-entry {
      display: grid;
      grid-template-columns: 60px 10px 1fr;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line-soft);
      animation: fadeIn 0.28s var(--ease) both;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }
    .log-time {
      color: var(--ink-4);
      font: 10px var(--font-mono);
      padding-top: 2px;
    }
    .log-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--azure);
      margin-top: 4px;
      box-shadow: 0 0 0 4px var(--azure-soft);
    }
    .log-entry.mutate .log-dot { background: var(--mint); box-shadow: 0 0 0 4px var(--mint-soft); }
    .log-entry.nav .log-dot { background: var(--amber); box-shadow: 0 0 0 4px var(--amber-soft); }
    .log-entry.system .log-dot { background: #94a3b8; box-shadow: 0 0 0 4px rgba(148, 163, 184, 0.12); }
    .log-title { font-size: 12.5px; font-weight: 700; color: var(--ink); }
    .log-copy { color: var(--ink-3); margin-top: 3px; font-size: 11.5px; line-height: 1.55; }

    .think-card {
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
    }
    .think-card h4 {
      margin: 0 0 6px;
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .think-card h4 .think-tag {
      font-family: var(--font-mono);
      font-size: 9.5px;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--azure-soft);
      color: var(--azure-ink);
    }
    .think-card p { margin: 0; font-size: 12px; line-height: 1.65; color: var(--ink-2); }

    .modal {
      position: absolute;
      inset: 50% auto auto 50%;
      transform: translate(-50%, -46%) scale(0.98);
      width: min(920px, calc(100vw - 32px));
      max-height: min(780px, calc(100vh - 40px));
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      background: var(--surface-solid);
      box-shadow: 0 38px 100px rgba(11, 18, 32, 0.25);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.34s var(--ease);
    }
    .modal-wrap.open .modal { transform: translate(-50%, -50%) scale(1); }
    .editor {
      flex: 1;
      min-height: 380px;
      width: 100%;
      border: 0;
      outline: 0;
      resize: none;
      padding: 20px 24px;
      background: color-mix(in srgb, var(--surface-solid) 96%, #0ea5e9 4%);
      color: var(--ink);
      font: 12.5px / 1.72 var(--font-mono);
      tab-size: 2;
    }
    .modal-foot {
      padding: 12px 20px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      background: var(--surface);
    }
    .primary-btn {
      background: var(--azure);
      color: #fff !important;
      border-color: var(--azure);
      font-weight: 700;
    }
    .primary-btn:hover { background: var(--azure-ink); border-color: var(--azure-ink); }

    .palette-search {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }
    .palette-input {
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      font-size: 15px;
      color: var(--ink);
    }
    .palette-list {
      max-height: 360px;
      overflow-y: auto;
      padding: 8px 12px;
    }
    .palette-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .palette-item:hover, .palette-item.active { background: var(--azure-soft); }
    .palette-item strong { font-size: 13.5px; color: var(--ink); }
    .palette-item span { font-family: var(--font-mono); font-size: 11px; color: var(--ink-4); }

    .toast-stack {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 120;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    .toast {
      min-width: 260px;
      max-width: 380px;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface-glass);
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow-md);
      animation: toastIn 0.32s var(--ease) both;
      pointer-events: auto;
    }
    .toast strong { display: block; font-size: 12px; font-weight: 700; color: var(--ink); }
    .toast span { display: block; margin-top: 3px; color: var(--ink-3); font-size: 11px; }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(12px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-width: 980px) {
      .shell { width: min(100% - 24px, 1280px); }
      .hero { grid-template-columns: 1fr; padding-top: 40px; }
      .global-progress { width: 120px; height: 120px; }
      .deck-card, .deck-card.feature { grid-column: span 6; }
      .detail-layout { grid-template-columns: 1fr; }
      .detail-side { position: relative; top: auto; }
    }
    @media (max-width: 680px) {
      .shell { width: min(100% - 16px, 1280px); }
      .topbar { top: 8px; padding-left: 12px; }
      .brand-meta, .hide-sm { display: none; }
      .hero { padding: 32px 4px 20px; }
      .deck-card, .deck-card.feature { grid-column: span 12; }
      .section-row { grid-template-columns: 40px minmax(0, 1fr) 28px; }
      .row-progress { display: none; }
      .detail-title { font-size: 32px; }
      .phase-axis { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="ambient"></div>

  <main class="shell">
    <header class="topbar">
      <div class="brand" id="homeBrand" title="回到项目总览">
        <div class="brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M5 15.2V8.8C5 7.1 6.35 5.75 8 5.75h3.2M19 8.8v6.4c0 1.7-1.35 3.05-3 3.05h-3.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="m9.4 9.2 5.2 2.8-5.2 2.8V9.2Z" fill="currentColor"/>
          </svg>
        </div>
        <div class="brand-copy">
          <span class="brand-name">md2board</span>
          <span class="brand-meta">规范驱动工作台</span>
        </div>
      </div>

      <div class="top-actions">
        <button class="action-btn" id="searchBtn" title="快捷搜索与跳转 (Ctrl+K)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <span class="hide-sm">搜索</span><span class="kbd">⌘K</span>
        </button>
        <button class="action-btn" id="specBtn" title="查看与编辑 Markdown 规格源 (M)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span class="hide-sm">规格源码</span><span class="kbd">M</span>
        </button>
        <button class="action-btn" id="telemetryBtn" title="遥测控制台与决策原理 (L)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 18V9m5 9V5m5 13v-6m5 6V7"/></svg>
          <span class="hide-sm">遥测</span><span class="kbd">L</span>
          <span class="badge-dot" id="logBadge" hidden>0</span>
        </button>
        <button class="icon-btn" id="themeBtn" title="切换深浅色彩主题" aria-label="切换色彩主题"></button>
      </div>
    </header>

    <section class="hero">
      <div>
        <div class="eyebrow">
          <span class="eyebrow-dot"></span>
          <span>单一事实来源 · 实时回写</span>
        </div>
        <h1 id="projectTitle">md2board · 项目进度看板</h1>
        <div class="goal" id="projectGoal"></div>
      </div>
      <div class="global-progress" id="globalProgress" style="--progress: 0%">
        <div class="global-progress-copy">
          <strong id="globalPct">0%</strong>
          <span>全局进度</span>
        </div>
      </div>
    </section>

    <div class="context-bar">
      <nav class="breadcrumbs" id="breadcrumbs" aria-label="当前路径"></nav>
      <div class="context-hint" id="contextHint">
        <span class="kbd">Esc</span> 返回上一级
      </div>
    </div>

    <section class="stage" id="stage"></section>
  </main>

  <div class="drawer-wrap" id="telemetryWrap" aria-hidden="true">
    <div class="scrim" data-close="telemetry"></div>
    <aside class="drawer" role="dialog" aria-modal="true" aria-label="遥测工作台">
      <div class="drawer-head">
        <div>
          <h3>遥测工作台</h3>
          <p>执行事件 · 架构决策 · 安全留痕</p>
        </div>
        <button class="icon-btn" data-close="telemetry" aria-label="关闭">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <div class="drawer-nav">
        <button class="drawer-tab active" data-tab="events">事件流 (Events)</button>
        <button class="drawer-tab" data-tab="principles">架构决策 (Principles)</button>
        <div style="margin-left: auto;">
          <button class="action-btn" id="clearLogBtn" style="height: 28px; padding: 0 8px; font-size: 11px;">清空</button>
        </div>
      </div>

      <div class="filter-chips" id="filterChips">
        <span class="chip active" data-filter="all">全部 (All)</span>
        <span class="chip" data-filter="mutate">变更 (Mutate)</span>
        <span class="chip" data-filter="nav">导航 (Nav)</span>
        <span class="chip" data-filter="system">系统 (System)</span>
      </div>

      <div class="drawer-body" id="drawerBody"></div>
    </aside>
  </div>

  <div class="modal-wrap" id="specWrap" aria-hidden="true">
    <div class="scrim" data-close="spec"></div>
    <section class="modal" role="dialog" aria-modal="true" aria-label="Markdown 规格源码">
      <div class="drawer-head">
        <div>
          <h3>Markdown · 唯一事实来源</h3>
          <p># 项目 · ## 阶段 · ### 章节 · #### 小节 · - [x] 验收项</p>
        </div>
        <button class="icon-btn" data-close="spec" aria-label="关闭">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <textarea class="editor" id="specEditor" spellcheck="false"></textarea>
      <div class="modal-foot">
        <div style="display: flex; gap: 8px;">
          <input type="file" id="fileInput" accept=".md,.markdown" style="display: none;" />
          <button class="action-btn" id="importFileBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            导入 .md 文件
          </button>
          <button class="action-btn" id="copySpecBtn">复制 Markdown</button>
          <button class="action-btn" id="exportSpecBtn" title="下载最新规格，用它覆盖磁盘上的源 .md 文件">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            导出 .md
          </button>
          <button class="action-btn" id="resetSpecBtn">恢复默认规格</button>
        </div>
        <button class="action-btn primary-btn" id="applySpecBtn">应用并重构</button>
      </div>
    </section>
  </div>

  <div class="modal-wrap" id="searchWrap" aria-hidden="true">
    <div class="scrim" data-close="search"></div>
    <section class="modal" style="max-width: 600px;" role="dialog" aria-modal="true" aria-label="快捷指令面板">
      <div class="palette-search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input class="palette-input" id="paletteInput" placeholder="输入阶段、章节或小节关键词快速跳转..." autocomplete="off" />
        <span class="kbd">Esc</span>
      </div>
      <div class="palette-list" id="paletteList"></div>
    </section>
  </div>

  <div class="toast-stack" id="toasts"></div>

  <script>
    /* Injected or default markdown specification */
    const initialMarkdown = `__INITIAL_MARKDOWN__`;

    const DECISION_PRINCIPLES = [
      {
        tag: 'MUTATION',
        title: '验收项是唯一可写事实来源',
        body: '阶段与章节之间体量差异巨大，若采用主观赋予的权重百分比会让项目真实进度失真。验收项是 Markdown 文档里天然存在的客观事实，因此它是唯一的进度派生来源，所有上层百分比皆为纯派生计算，不可人为篡改。'
      },
      {
        tag: 'ALGORITHM',
        title: '空小节安全退出加权，防止稀释',
        body: '对于未定义验收清单的小节或规划中节点，直接退出加权计算，而不是视为 0 分。否则仅列出标题的大纲小节会将父级进度大幅拉低，造成进展停滞的虚假危机感。'
      },
      {
        tag: 'SPATIAL',
        title: '下钻保留空间景深与推入连续性',
        body: '层级之间严禁突兀全屏重刷：前进时向左推入新层，后退时向右滑出旧层。在 PPT 式 Deck 演示中，让团队始终对当前所处的树形坐标与层级深度具备空间连续感知。'
      },
      {
        tag: 'FEEDBACK',
        title: '进度回算采用即时传导波',
        body: '就地勾选任意验收项时，小节状态即时变更，并同步驱动章节、阶段与全局仪表盘的光波与数字更新。数据变更清晰可感知，闭环立现。'
      },
      {
        tag: 'OBSERVABILITY',
        title: '观测遥测与主工作流解耦',
        body: '运行事件流与架构思考链统一收纳于侧滑抽屉（快捷键 L），主视图保持宁静整洁的交付汇报级质感，杜绝大屏日志对核心目标的注意力挤占。'
      }
    ];

    const $ = (sel, el = document) => el.querySelector(sel);
    const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];

    const THEME_KEY = 'md2board-theme-mode';

    /* Storage is scoped per spec content, so multiple decks opened from
       the same file:// origin never overwrite each other's mutations. */
    function hashSeed(str) {
      let h = 5381;
      for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0;
      return h.toString(36);
    }
    const STORAGE_KEY = 'md2board-spec-' + hashSeed(initialMarkdown);

    const state = {
      markdown: localStorage.getItem(STORAGE_KEY) || initialMarkdown,
      project: null,
      route: { level: 1, phase: null, chapter: null, section: null },
      direction: 'forward',
      logs: [],
      unreadCount: 0,
      activeDrawerTab: 'events',
      activeFilter: 'all',
      theme: localStorage.getItem(THEME_KEY) || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    };

    function uid(prefix, text, idx) {
      return prefix + '-' + String(text || 'item').toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]+/g, '-').replace(/(^-|-$)/g, '').slice(0, 40) + '-' + idx;
    }

    function cleanTitle(str = '') {
      return str.replace(/^\d+(?:[.\-、]\d+)*[.\-\s、]+/, '').trim();
    }

    function parseMarkdown(md) {
      const lines = md.replace(/\r\n?/g, '\n').split('\n');
      const project = { title: 'Untitled Project', goal: '', phases: [], sourceLines: lines.slice() };
      let phase = null, chapter = null, section = null, inDiff = false, inCode = false, diffBuffer = [];

      const attachQuote = (text) => {
        if (section) section.goal = [section.goal, text].filter(Boolean).join(' ');
        else if (chapter) chapter.goal = [chapter.goal, text].filter(Boolean).join(' ');
        else if (phase) phase.goal = [phase.goal, text].filter(Boolean).join(' ');
        else project.goal = [project.goal, text].filter(Boolean).join(' ');
      };

      lines.forEach((raw, lineIndex) => {
        const line = raw.trim();
        if (line.startsWith('```')) {
          if (inCode) { inCode = false; return; }
          if (inDiff) { if (section) section.diff = diffBuffer.join('\n'); inDiff = false; diffBuffer = []; return; }
          if (line === '```diff') { inDiff = true; diffBuffer = []; return; }
          inCode = true; return;
        }
        if (inCode) return;
        if (inDiff) { diffBuffer.push(raw); return; }

        let m;
        if ((m = line.match(/^#\s+(.+)$/))) { project.title = m[1].trim(); return; }
        if ((m = line.match(/^##\s+(.+)$/))) {
          phase = { id: uid('phase', m[1], project.phases.length), title: cleanTitle(m[1]), rawTitle: m[1].trim(), goal: '', chapters: [] };
          project.phases.push(phase); chapter = null; section = null; return;
        }
        if ((m = line.match(/^###\s+(.+)$/))) {
          if (!phase) return;
          chapter = { id: uid('chapter', m[1], phase.chapters.length), title: cleanTitle(m[1]), rawTitle: m[1].trim(), goal: '', sections: [] };
          phase.chapters.push(chapter); section = null; return;
        }
        if ((m = line.match(/^####\s+(.+)$/))) {
          if (!chapter) return;
          section = { id: uid('section', m[1], chapter.sections.length), title: cleanTitle(m[1]), rawTitle: m[1].trim(), goal: '', tasks: [], diff: '' };
          chapter.sections.push(section); return;
        }
        if ((m = line.match(/^>\s*(.+)$/))) { attachQuote(m[1].trim()); return; }
        if ((m = line.match(/^-\s*\[([ xX])\]\s*(.+)$/))) {
          if (!section) return;
          section.tasks.push({
            id: uid('task', m[2], lineIndex),
            text: m[2].trim(),
            checked: m[1].toLowerCase() === 'x',
            lineIndex
          });
        }
      });
      return project;
    }

    function countTasks(node) {
      if (!node) return { done: 0, total: 0 };
      if (node.tasks) return { done: node.tasks.filter(t => t.checked).length, total: node.tasks.length };
      const children = node.sections || node.chapters || node.phases || [];
      return children.reduce((acc, c) => {
        const x = countTasks(c); acc.done += x.done; acc.total += x.total; return acc;
      }, { done: 0, total: 0 });
    }

    function pct(node) { const c = countTasks(node); return c.total ? Math.round((c.done / c.total) * 100) : 0; }
    function status(node) {
      const p = pct(node), c = countTasks(node);
      if (!c.total) return ['wait', '未规划'];
      if (p === 100) return ['done', '已完成'];
      if (p === 0) return ['wait', '待启动'];
      return ['', '进行中'];
    }

    function escapeHtml(s = '') { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

    function icon(name, size = 16) {
      const icons = {
        sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/>',
        moon: '<path d="M20.4 15.5A8.5 8.5 0 0 1 8.5 3.6 8.5 8.5 0 1 0 20.4 15.5Z"/>',
        arrow: '<path d="m9 18 6-6-6-6"/>',
        back: '<path d="m15 18-6-6 6-6"/>',
        check: '<path d="m5 12 4 4L19 6"/>'
      };
      return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icons[name] || ''}</svg>`;
    }

    function addLog(type, title, copy) {
      const t = new Date();
      const timeStr = t.toTimeString().slice(0, 8);
      state.logs.unshift({ type, title, copy, time: timeStr });
      if (state.logs.length > 300) state.logs.pop();

      if (!$('#telemetryWrap').classList.contains('open')) {
        state.unreadCount++;
        updateLogBadge();
      }
      if (state.activeDrawerTab === 'events') renderEventsList();
    }

    function updateLogBadge() {
      const badge = $('#logBadge');
      if (state.unreadCount > 0) {
        badge.hidden = false;
        badge.textContent = state.unreadCount > 99 ? '99+' : state.unreadCount;
      } else {
        badge.hidden = true;
      }
    }

    function renderDrawerContent() {
      const body = $('#drawerBody');
      if (!body) return;
      if (state.activeDrawerTab === 'principles') {
        $('#filterChips').style.display = 'none';
        body.innerHTML = DECISION_PRINCIPLES.map(p => `
          <div class="think-card">
            <h4><span class="think-tag">${escapeHtml(p.tag)}</span>${escapeHtml(p.title)}</h4>
            <p>${p.body}</p>
          </div>
        `).join('');
      } else {
        $('#filterChips').style.display = 'flex';
        renderEventsList();
      }
    }

    function renderEventsList() {
      const body = $('#drawerBody');
      if (!body) return;
      const filtered = state.activeFilter === 'all' ? state.logs : state.logs.filter(l => l.type === state.activeFilter);
      if (!filtered.length) {
        body.innerHTML = `<div style="text-align: center; color: var(--ink-4); padding: 40px 0; font-family: var(--font-mono); font-size: 12px;">暂无该类事件记录</div>`;
        return;
      }
      body.innerHTML = filtered.map(l => `
        <div class="log-entry ${l.type}">
          <div class="log-time">${l.time}</div>
          <div class="log-dot"></div>
          <div>
            <div class="log-title">${escapeHtml(l.title)}</div>
            <div class="log-copy">${escapeHtml(l.copy)}</div>
          </div>
        </div>
      `).join('');
    }

    function toast(title, copy) {
      const stack = $('#toasts');
      const el = document.createElement('div');
      el.className = 'toast';
      el.innerHTML = `<strong>${escapeHtml(title)}</strong><span>${escapeHtml(copy)}</span>`;
      stack.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(8px)';
        setTimeout(() => el.remove(), 250);
      }, 2400);
    }

    function currentNodes() {
      const r = state.route;
      const phase = state.project.phases.find(x => x.id === r.phase) || null;
      const chapter = phase?.chapters.find(x => x.id === r.chapter) || null;
      const section = chapter?.sections.find(x => x.id === r.section) || null;
      return { phase, chapter, section };
    }

    function updateChrome() {
      document.documentElement.dataset.theme = state.theme;
      $('#themeBtn').innerHTML = icon(state.theme === 'dark' ? 'sun' : 'moon');
      $('#projectTitle').textContent = state.project.title;
      $('#projectGoal').textContent = state.project.goal;

      const p = pct(state.project);
      $('#globalPct').textContent = p + '%';
      $('#globalProgress').style.setProperty('--progress', p + '%');
      const hint = $('#contextHint');
      if (hint) hint.style.visibility = state.route.level > 1 ? 'visible' : 'hidden';
      renderBreadcrumbs();
    }

    function renderBreadcrumbs() {
      const { phase, chapter, section } = currentNodes();
      const parts = [{ label: '总览', level: 1 }];
      if (phase) parts.push({ label: phase.title, level: 2, phase: phase.id });
      if (chapter) parts.push({ label: chapter.title, level: 3, phase: phase.id, chapter: chapter.id });
      if (section) parts.push({ label: section.title, level: 4, phase: phase.id, chapter: chapter.id, section: section.id });

      $('#breadcrumbs').innerHTML = parts.map((p, i) => `
        ${i ? '<span class="crumb-sep">/</span>' : ''}
        <button class="crumb ${i === parts.length - 1 ? 'current' : ''}" data-route='${JSON.stringify(p)}'>${escapeHtml(p.label)}</button>
      `).join('');

      $$('#breadcrumbs .crumb:not(.current)').forEach(btn => {
        btn.addEventListener('click', () => navigate(JSON.parse(btn.dataset.route), 'back'));
      });
    }

    function sectionHeader(kicker, title, goal, stat = '') {
      return `
        <div class="section-head">
          <div>
            <div class="section-kicker">${escapeHtml(kicker)}</div>
            <h2>${escapeHtml(title)}</h2>
            <p>${escapeHtml(goal || '')}</p>
          </div>
          ${stat ? `<div class="section-stat">${escapeHtml(stat)}</div>` : ''}
        </div>
      `;
    }

    function progressMarkup(node) {
      const p = pct(node), c = countTasks(node);
      return `
        <div class="progress-row">
          <span>${c.done}/${c.total} 项验收</span>
          <span>${p}%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" style="width: ${p}%"></div>
        </div>
      `;
    }

    function renderLevel1() {
      const phases = state.project.phases;
      const c = countTasks(state.project);
      return `
        <div class="view ${state.direction === 'back' ? 'in-back' : 'in-forward'}">
          ${sectionHeader('Level 1 · 宏观航线', '项目推进总览', '聚焦顶层阶段与推进节奏，过滤局部细节噪音，保持汇报视角清爽。', `${c.done}/${c.total} 项验收达成`)}
          <div class="phase-axis" style="--count: ${Math.max(phases.length, 1)}">
            ${phases.map(p => `
              <div class="axis-node">
                <div class="axis-track">
                  <div class="axis-fill" style="width: ${pct(p)}%"></div>
                </div>
                <div class="axis-label">${escapeHtml(p.title)} · ${pct(p)}%</div>
              </div>
            `).join('')}
          </div>
          <div class="deck-grid">
            ${phases.map(p => {
              const [cls, txt] = status(p);
              return `
                <article class="deck-card ${phases.length <= 2 ? 'feature' : ''}" data-phase="${p.id}">
                  <div class="meta-row">
                    <span class="type-label">Phase</span>
                    <span class="status-pill ${cls}"><i class="status-dot"></i>${txt}</span>
                  </div>
                  <h3>${escapeHtml(p.title)}</h3>
                  <p>${escapeHtml(p.goal)}</p>
                  <div class="card-footer">${progressMarkup(p)}</div>
                </article>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderLevel2(phase) {
      return `
        <div class="view ${state.direction === 'back' ? 'in-back' : 'in-forward'}">
          <div class="back-row">
            <button class="back-btn" data-back>${icon('back', 14)} 总览</button>
            <span class="section-stat">阶段进度 · ${pct(phase)}%</span>
          </div>
          ${sectionHeader('Level 2 · 架构章节', phase.title, phase.goal, `${phase.chapters.length} 个章节`)}
          <div class="deck-grid">
            ${phase.chapters.map(c => {
              const [cls, txt] = status(c);
              return `
                <article class="deck-card ${phase.chapters.length <= 2 ? 'feature' : ''}" data-chapter="${c.id}">
                  <div class="meta-row">
                    <span class="type-label">Chapter</span>
                    <span class="status-pill ${cls}"><i class="status-dot"></i>${txt}</span>
                  </div>
                  <h3>${escapeHtml(c.title)}</h3>
                  <p>${escapeHtml(c.goal)}</p>
                  <div class="card-footer">${progressMarkup(c)}</div>
                </article>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderLevel3(phase, chapter) {
      return `
        <div class="view ${state.direction === 'back' ? 'in-back' : 'in-forward'}">
          <div class="back-row">
            <button class="back-btn" data-back>${icon('back', 14)} ${escapeHtml(phase.title)}</button>
            <span class="section-stat">章节进度 · ${pct(chapter)}%</span>
          </div>
          ${sectionHeader('Level 3 · 执行小节', chapter.title, chapter.goal, `${chapter.sections.length} 个小节`)}
          <div class="list-surface">
            ${chapter.sections.map((s, i) => `
              <div class="section-row" data-section="${s.id}">
                <div class="row-num">${String(i + 1).padStart(2, '0')}</div>
                <div>
                  <div class="row-title">${escapeHtml(s.title)}</div>
                  <div class="row-sub">${escapeHtml(s.goal)}</div>
                </div>
                <div class="row-progress">
                  <div class="progress-track">
                    <div class="progress-fill" style="width: ${pct(s)}%"></div>
                  </div>
                  <span>${pct(s)}%</span>
                </div>
                <div class="chev">${icon('arrow', 15)}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderDiff(diff = '') {
      if (!diff.trim()) {
        return `
          <div class="diff-card">
            <div class="diff-bar">
              <span>Δ increment.diff</span>
              <div class="window-dots"><i></i><i></i><i></i></div>
            </div>
            <pre class="diff-code"><span class="diff-line">// 该小节暂未附加代码增量快照</span></pre>
          </div>
        `;
      }
      return `
        <div class="diff-card">
          <div class="diff-bar">
            <span>increment.diff</span>
            <div class="window-dots"><i></i><i></i><i></i></div>
          </div>
          <pre class="diff-code">${diff.split('\n').map(l => {
            const cls = l.startsWith('+') ? 'add' : l.startsWith('-') ? 'del' : l.startsWith('@@') ? 'meta' : '';
            return `<span class="diff-line ${cls}">${escapeHtml(l) || ' '}</span>`;
          }).join('')}</pre>
        </div>
      `;
    }

    function renderLevel4(phase, chapter, section) {
      const c = countTasks(section);
      const [cls, txt] = status(section);
      return `
        <div class="view ${state.direction === 'back' ? 'in-back' : 'in-forward'}">
          <div class="back-row">
            <button class="back-btn" data-back>${icon('back', 14)} ${escapeHtml(chapter.title)}</button>
            <span class="status-pill ${cls}"><i class="status-dot"></i>${txt}</span>
          </div>
          <div class="detail-layout">
            <div class="detail-main">
              <div class="section-kicker">Level 4 · 规格与验收</div>
              <h2 class="detail-title">${escapeHtml(section.title)}</h2>
              <div class="detail-goal">${escapeHtml(section.goal)}</div>
              <div class="detail-metrics">
                <div class="metric">
                  <strong>${pct(section)}%</strong>
                  <span>小节进度</span>
                </div>
                <div class="metric">
                  <strong>${c.done}/${c.total}</strong>
                  <span>已验收</span>
                </div>
                <div class="metric">
                  <strong>${pct(chapter)}%</strong>
                  <span>章节进度</span>
                </div>
                <div class="metric">
                  <strong>${pct(phase)}%</strong>
                  <span>阶段进度</span>
                </div>
              </div>
              <div class="checklist-title">
                <h3>验收清单</h3>
                <span>勾选即时回写 · 经「导出 .md」落盘</span>
              </div>
              <div class="checklist">
                ${section.tasks.map((t, i) => `
                  <label class="check-item ${t.checked ? 'is-done' : ''}">
                    <input class="check-box" type="checkbox" data-line="${t.lineIndex}" ${t.checked ? 'checked' : ''} />
                    <span class="check-copy">${escapeHtml(t.text)}</span>
                    <span class="check-code">A${String(i + 1).padStart(2, '0')}</span>
                  </label>
                `).join('') || '<div class="check-item"><span class="check-copy" style="color: var(--ink-4)">暂无验收项</span></div>'}
              </div>
            </div>
            <aside class="detail-side">
              <div class="diff-title">
                <h3>增量快照</h3>
                <span>规格绑定 Diff</span>
              </div>
              ${renderDiff(section.diff)}
              <div class="breakdown-card">
                <div class="diff-title" style="margin-bottom: 16px;">
                  <h3>进度分解</h3>
                  <span>祖先进度传导</span>
                </div>
                ${[['本小节', section], ['所属章节', chapter], ['所属阶段', phase]].map(([label, node]) => {
                  const cc = countTasks(node);
                  return `
                    <div class="breakdown-row">
                      <div class="breakdown-head">
                        <span>${escapeHtml(label)}</span>
                        <span>${cc.done}/${cc.total} 项</span>
                        <span>${pct(node)}%</span>
                      </div>
                      <div class="progress-track">
                        <div class="progress-fill" style="width: ${pct(node)}%"></div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </aside>
          </div>
        </div>
      `;
    }

    function renderStage() {
      const stage = $('#stage');
      const { phase, chapter, section } = currentNodes();
      let html = '';

      if (state.route.level === 1) html = renderLevel1();
      else if (state.route.level === 2 && phase) html = renderLevel2(phase);
      else if (state.route.level === 3 && phase && chapter) html = renderLevel3(phase, chapter);
      else if (state.route.level === 4 && phase && chapter && section) html = renderLevel4(phase, chapter, section);
      else {
        state.route = { level: 1, phase: null, chapter: null, section: null };
        html = renderLevel1();
      }

      stage.innerHTML = html;
      bindStageEvents();
      updateChrome();
    }

    function bindStageEvents() {
      $$('[data-phase]').forEach(el => {
        el.addEventListener('click', () => navigate({ level: 2, phase: el.dataset.phase }, 'forward'));
      });
      $$('[data-chapter]').forEach(el => {
        el.addEventListener('click', () => navigate({ level: 3, phase: state.route.phase, chapter: el.dataset.chapter }, 'forward'));
      });
      $$('[data-section]').forEach(el => {
        el.addEventListener('click', () => navigate({ level: 4, phase: state.route.phase, chapter: state.route.chapter, section: el.dataset.section }, 'forward'));
      });
      $('[data-back]')?.addEventListener('click', goBack);
      $$('.check-box').forEach(cb => {
        cb.addEventListener('change', () => toggleChecklist(Number(cb.dataset.line), cb.checked));
      });

      $$('.deck-card').forEach(card => {
        card.addEventListener('mousemove', e => {
          const rect = card.getBoundingClientRect();
          card.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
          card.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
        });
      });
    }

    function navigate(route, direction = 'forward') {
      state.direction = direction;
      state.route = {
        level: route.level,
        phase: route.phase || null,
        chapter: route.chapter || null,
        section: route.section || null
      };

      addLog('nav', '层级导航', `工作台已切换至第 ${route.level} 层${route.section ? '（小节）' : ''}${route.chapter && !route.section ? '（章节）' : ''}${route.phase && !route.chapter ? '（阶段）' : ''}。`);

      // 视图切换必须是「必达」的：某些环境（页面不可见、无头渲染、
      // 过渡被取消）下 startViewTransition 的回调可能不触发，若只依赖它
      // 渲染，就会出现「状态已切层、界面还停在旧层」的静默失步。
      let rendered = false;
      const commit = () => {
        if (rendered) return;
        rendered = true;
        renderStage();
      };
      if (document.startViewTransition) {
        try {
          const transition = document.startViewTransition(commit);
          if (transition && transition.finished && transition.finished.catch) {
            transition.finished.catch(() => commit());
          }
        } catch (err) {
          commit();
        }
        setTimeout(commit, 250);
      } else {
        commit();
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function goBack() {
      const r = state.route;
      if (r.level === 4) navigate({ level: 3, phase: r.phase, chapter: r.chapter }, 'back');
      else if (r.level === 3) navigate({ level: 2, phase: r.phase }, 'back');
      else if (r.level === 2) navigate({ level: 1 }, 'back');
    }

    function toggleChecklist(lineIndex, checked) {
      const lines = state.markdown.replace(/\r\n?/g, '\n').split('\n');
      const line = lines[lineIndex];
      if (!line) return;

      const next = line.replace(/^(\s*)-\s*\[[ xX]\]/, checked ? '$1- [x]' : '$1- [ ]');
      if (next === line) {
        toast('回写失败', `第 ${lineIndex + 1} 行不是标准验收项语法，未能更新。`);
        renderStage();
        return;
      }
      lines[lineIndex] = next;
      state.markdown = lines.join('\n');
      localStorage.setItem(STORAGE_KEY, state.markdown);

      const preservedRoute = { ...state.route };
      state.project = parseMarkdown(state.markdown);
      $('#specEditor').value = state.markdown;
      state.route = preservedRoute;
      state.direction = 'forward';

      renderStage();

      const itemLabel = line.replace(/^\s*-\s*\[[ xX]\]\s*/, '').slice(0, 24);
      addLog('mutate', checked ? `完成验收「${itemLabel}…」` : `重开验收「${itemLabel}…」`, `Markdown 第 ${lineIndex + 1} 行已就地更新（浏览器缓存），祖先进度条与全局进度环已重算。需落盘时请用「导出 .md」下载后覆盖源文件。`);
      toast(checked ? '验收项已锁定' : '验收项已重开', `项目全局推进度现为 ${pct(state.project)}%。`);
    }

    function openPanel(which) {
      if (which === 'spec') {
        $('#specWrap').classList.add('open');
        $('#specWrap').setAttribute('aria-hidden', 'false');
        $('#specEditor').value = state.markdown;
        setTimeout(() => $('#specEditor').focus(), 80);
      } else if (which === 'telemetry') {
        $('#telemetryWrap').classList.add('open');
        $('#telemetryWrap').setAttribute('aria-hidden', 'false');
        state.unreadCount = 0;
        updateLogBadge();
        renderDrawerContent();
      } else if (which === 'search') {
        $('#searchWrap').classList.add('open');
        $('#searchWrap').setAttribute('aria-hidden', 'false');
        $('#paletteInput').value = '';
        renderPaletteResults('');
        setTimeout(() => $('#paletteInput').focus(), 80);
      }
    }

    function closePanel(which) {
      const el = which === 'spec' ? $('#specWrap') : which === 'telemetry' ? $('#telemetryWrap') : $('#searchWrap');
      el.classList.remove('open');
      el.setAttribute('aria-hidden', 'true');
    }

    function rebuildFromEditor() {
      const md = $('#specEditor').value.trim();
      if (!md) {
        toast('构建未执行', 'Markdown 规格内容不能为空。');
        return;
      }
      state.markdown = md;
      localStorage.setItem(STORAGE_KEY, state.markdown);
      state.project = parseMarkdown(md);
      state.route = { level: 1, phase: null, chapter: null, section: null };
      state.direction = 'back';
      renderStage();
      closePanel('spec');

      addLog('system', '规格源码全量重构', `重新解析了 ${state.project.phases.length} 个阶段、${countTasks(state.project).total} 个验收条目。`);
      toast('工作台重构完成', '已根据最新 Markdown 源码完成规格映射。');
    }

    function getAllSearchableNodes() {
      const nodes = [];
      state.project.phases.forEach(p => {
        nodes.push({ type: 'Phase 阶段', title: p.title, goal: p.goal, route: { level: 2, phase: p.id } });
        p.chapters.forEach(c => {
          nodes.push({ type: 'Chapter 章节', title: `${p.title} / ${c.title}`, goal: c.goal, route: { level: 3, phase: p.id, chapter: c.id } });
          c.sections.forEach(s => {
            nodes.push({ type: 'Section 小节', title: `${c.title} / ${s.title}`, goal: s.goal, route: { level: 4, phase: p.id, chapter: c.id, section: s.id } });
          });
        });
      });
      return nodes;
    }

    function renderPaletteResults(query = '') {
      const list = $('#paletteList');
      const all = getAllSearchableNodes();
      const q = query.toLowerCase().trim();
      const results = q ? all.filter(n => n.title.toLowerCase().includes(q) || n.goal.toLowerCase().includes(q)) : all.slice(0, 15);

      if (!results.length) {
        list.innerHTML = `<div style="padding: 24px; text-align: center; color: var(--ink-4); font-size: 13px;">无匹配节点</div>`;
        return;
      }

      list.innerHTML = results.map((r, i) => `
        <div class="palette-item ${i === 0 ? 'active' : ''}" data-nav='${JSON.stringify(r.route)}'>
          <strong>${escapeHtml(r.title)}</strong>
          <span>${escapeHtml(r.type)}</span>
        </div>
      `).join('');

      $$('.palette-item').forEach(item => {
        item.addEventListener('click', () => {
          const route = JSON.parse(item.dataset.nav);
          closePanel('search');
          navigate(route, 'forward');
        });
      });
    }

    function init() {
      if (!/Mac|iPhone|iPad/.test(navigator.userAgent)) {
        $$('.kbd').forEach(k => {
          if (k.textContent.includes('⌘')) k.textContent = k.textContent.replace('⌘', 'Ctrl ');
        });
      }
      state.project = parseMarkdown(state.markdown);
      document.documentElement.dataset.theme = state.theme;
      $('#specEditor').value = state.markdown;

      renderStage();

      addLog('system', '规格解析就绪', `已初始化 ${state.project.phases.length} 个阶段，共计 ${countTasks(state.project).total} 个原子验收项。`);
      addLog('system', '事实来源锁定', 'Markdown 作为唯一事实来源，与工作台保持毫秒级双向投影。');

      $('#homeBrand').addEventListener('click', () => navigate({ level: 1 }, 'back'));
      $('#specBtn').addEventListener('click', () => openPanel('spec'));
      $('#telemetryBtn').addEventListener('click', () => openPanel('telemetry'));
      $('#searchBtn').addEventListener('click', () => openPanel('search'));
      $('#applySpecBtn').addEventListener('click', rebuildFromEditor);

      $('#themeBtn').addEventListener('click', () => {
        state.theme = state.theme === 'dark' ? 'light' : 'dark';
        localStorage.setItem(THEME_KEY, state.theme);
        updateChrome();
        addLog('system', '主题切换', `已切换至 ${state.theme === 'dark' ? '黑曜石深色' : '清爽晨雾浅色'} 调色盘。`);
      });

      $$('.drawer-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          $$('.drawer-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          state.activeDrawerTab = tab.dataset.tab;
          renderDrawerContent();
        });
      });

      $$('.chip').forEach(chip => {
        chip.addEventListener('click', () => {
          $$('.chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          state.activeFilter = chip.dataset.filter;
          renderEventsList();
        });
      });

      $('#clearLogBtn').addEventListener('click', () => {
        state.logs = [];
        renderEventsList();
        toast('日志已清空', '遥测事件流已恢复初始空状态。');
      });

      $('#importFileBtn').addEventListener('click', () => $('#fileInput').click());
      $('#fileInput').addEventListener('change', e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = evt => {
          $('#specEditor').value = evt.target.result;
          toast('文件已读入', `已成功载入「${file.name}」，点击 Apply 即可重新构建。`);
        };
        reader.readAsText(file);
      });

      $('#copySpecBtn').addEventListener('click', () => {
        navigator.clipboard.writeText($('#specEditor').value).then(() => {
          toast('已复制到剪贴板', '当前 Markdown 规格源码已成功复制。');
        });
      });

      $('#exportSpecBtn').addEventListener('click', () => {
        const blob = new Blob([state.markdown], { type: 'text/markdown;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = (state.project.title || 'md2board').replace(/[\\/:*?"<>|]+/g, '_') + '.md';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(a.href);
        addLog('mutate', '导出规格快照', '已下载包含全部勾选状态的最新的 Markdown，请用它覆盖磁盘上的源文件。');
        toast('已导出 Markdown', '请用下载的文件覆盖源 .md，完成事实源同步。');
      });

      $('#resetSpecBtn').addEventListener('click', () => {
        if (confirm('确认恢复为默认规格？自定义修改将被替换。')) {
          state.markdown = initialMarkdown;
          localStorage.removeItem(STORAGE_KEY);
          $('#specEditor').value = initialMarkdown;
          rebuildFromEditor();
        }
      });

      $('#paletteInput').addEventListener('input', e => renderPaletteResults(e.target.value));
      $$('[data-close]').forEach(el => el.addEventListener('click', () => closePanel(el.dataset.close)));

      document.addEventListener('keydown', e => {
        const isEditing = ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName);
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'enter' && $('#specWrap').classList.contains('open')) {
          e.preventDefault();
          rebuildFromEditor();
          return;
        }
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          if ($('#searchWrap').classList.contains('open')) closePanel('search');
          else openPanel('search');
          return;
        }
        if (e.key === 'Escape') {
          if ($('#searchWrap').classList.contains('open')) return closePanel('search');
          if ($('#specWrap').classList.contains('open')) return closePanel('spec');
          if ($('#telemetryWrap').classList.contains('open')) return closePanel('telemetry');
          if (state.route.level > 1) goBack();
          return;
        }
        if (e.key === 'Backspace' && !isEditing && state.route.level > 1) {
          e.preventDefault();
          goBack();
          return;
        }
        if (!isEditing) {
          if (e.key.toLowerCase() === 'm') openPanel('spec');
          if (e.key.toLowerCase() === 'l') openPanel('telemetry');
        }
      });
    }

    init();
  </script>
</body>
</html>
